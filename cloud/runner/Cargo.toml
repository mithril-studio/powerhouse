[package]
name = "powerhouse-runner"
version = "0.1.0"
edition = "2021"
description = "Supervised in-VM runner for Powerhouse cloud agent runs."

[[bin]]
name = "powerhouse-runner"
path = "src/main.rs"

[dependencies]
powerhouse-cloud-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
signal-hook = "0.3"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
